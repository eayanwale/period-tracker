name: Broker Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  deploy:
    uses: eayanwale/homelab-ci/.github/workflows/build-and-deploy.yml@main
    with:
      image: ghcr.io/eayanwale/period-tracker
      dockerfile: Dockerfile
      context: .
      platforms: linux/amd64,linux/arm64
      scan_enabled: true
      instance_id: "21"
      broker_url: https://lab.knoch.dev
      broker_tailscale_url: http://100.119.250.100:8000
    secrets:
      BROKER_DEPLOY_TOKEN: ${{ secrets.BROKER_DEPLOY_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
