name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax-check frontend JS
        run: |
          for f in frontend/js/*.js frontend/js/*.mjs; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Run cycle.js unit checks
        run: node frontend/js/test-cycle.mjs

      - name: Syntax-check backend JS
        run: |
          node --check backend/lambda/index.mjs
          node --check backend/scripts/seed-dates.mjs

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform -chdir=backend/terraform fmt -check -recursive

      - name: Terraform init (no backend access needed for validate)
        run: terraform -chdir=backend/terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=backend/terraform validate

  deploy-frontend:
    name: Deploy frontend
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      SITE_BUCKET: period-tracker-site-947792709164
      CLOUDFRONT_DISTRIBUTION_ID: E1UYB66GK7QRKA
      DEPLOY_ROLE_ARN: arn:aws:iam::947792709164:role/period-tracker-github-actions-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/ "s3://$SITE_BUCKET" \
            --delete \
            --exclude "icons/generate_icons.py" \
            --exclude "js/test-cycle.mjs"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
