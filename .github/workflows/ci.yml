name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax-check frontend JS
        run: |
          for f in frontend/js/*.js frontend/js/*.mjs; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Run cycle.js unit checks
        run: node frontend/js/test-cycle.mjs

      - name: Syntax-check backend JS
        run: |
          node --check backend/lambda/index.mjs
          node --check backend/scripts/seed-dates.mjs

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform -chdir=backend/terraform fmt -check -recursive

      - name: Terraform init (no backend access needed for validate)
        run: terraform -chdir=backend/terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=backend/terraform validate

# Auto-deploy (S3 sync + CloudFront invalidation) is disabled for now: the
# GitHub OIDC role exists (backend/terraform/ci.tf, output
# github_actions_role_arn) and is scoped correctly, but this AWS account
# sits in an Organization with an SCP that denies
# sts:AssumeRoleWithWebIdentity outright. Sort that out at the org level,
# then reintroduce a deploy-frontend job here (see git history for the
# working version) that assumes github_actions_role_arn via
# aws-actions/configure-aws-credentials and runs `aws s3 sync` +
# `aws cloudfront create-invalidation`. Until then, deploy manually.
